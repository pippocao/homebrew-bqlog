name: Repro - bqlog Linux x86_64 OOM

# The unbounded `cmake --build build --parallel` in the formula makes make run an unlimited
# number of jobs and the 16 GB runner runs out of memory: it was at 15.1 GB used after 30 s and
# then the process was SIGKILLed (exit 137), taking the runner down with it. Build with a bounded
# number of jobs and watch the memory profile.
on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        parallel: ["4", "2"]
    container:
      image: ghcr.io/homebrew/brew:main
      options: --init --user linuxbrew
    defaults:
      run:
        working-directory: /home/linuxbrew
        shell: /bin/bash -xeuo pipefail {0}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOME: /home/linuxbrew
    steps:
      - name: Environment
        run: |
          echo "HOME=$HOME"; mkdir -p "$HOME/.homebrew"
          echo "cpus: $(nproc)"; free -m | sed -n 2p; brew --version

      - name: Put a formula with a bounded parallel build in a tap
        run: |
          brew tap-new --no-git bqlog/ci
          cat >"$(brew --repository)/Library/Taps/bqlog/homebrew-ci/Formula/bqlog.rb" <<'FORMULA_EOF'
            class Bqlog < Formula
              desc "Lightweight, high-performance, cross-language logging library"
              homepage "https://github.com/Tencent/BqLog"
              # Placeholders: the release workflow and bump.sh write the url and sha256 of the new tag here.
              # An unfilled formula fails to fetch on purpose.
              url "https://github.com/Tencent/BqLog/archive/refs/tags/Release_2.7.0.tar.gz"
              sha256 "0edb9fd3ba80fd286958317848cbd10795aea9c273f88c80a6fe8903afc01de5"
              license "Apache-2.0"

              head "https://github.com/Tencent/BqLog.git", branch: "main"

              livecheck do
                url :stable
                regex(/^Release[._-]v?(\d+(?:\.\d+)+)$/i)
              end

              depends_on "cmake" => :build

              deny_network_access!

              def install
                args = ["-DBUILD_LIB_TYPE=both", "-DBQ_BUILD_TOOLS=ON", "-DBQ_WERROR=OFF"]
                args << "-DCMAKE_OSX_ARCHITECTURES=#{Hardware::CPU.arch}" if OS.mac?

                system "cmake", "-S", ".", "-B", "build", *std_cmake_args, *args
                system "cmake", "--build", "build", "--parallel", "PARALLEL_PLACEHOLDER"
                system "cmake", "--install", "build"
              end

              test do
                (testpath/"test.cpp").write <<~'CPP'
                  #include <bq_log/bq_log.h>

                  int main() {
                      // create_log rejects a config without an appenders_config object, so name one.
                      bq::log log = bq::log::create_log("homebrew_test",
                          "appenders_config.console.type=console\n"
                          "appenders_config.console.levels=[all]");
                      if (!log.is_valid()) {
                          return 1;
                      }
                      log.info("bqlog installed and linked");
                      log.force_flush();
                      return 0;
                  }
                CPP
                system ENV.cxx, "test.cpp", "-std=c++17",
                       "-I#{include}", "-L#{lib}", "-lBqLog", "-Wl,-rpath,#{lib}",
                       "-o", "test"
                system "./test"

                assert_predicate bin/"BqLog_CategoryLogGenerator", :executable?
                assert_predicate bin/"BqLog_LogDecoder", :executable?
              end
            end
          FORMULA_EOF
          sed -i "s/PARALLEL_PLACEHOLDER/${{ matrix.parallel }}/" "$(brew --repository)/Library/Taps/bqlog/homebrew-ci/Formula/bqlog.rb"
          grep -n 'parallel' "$(brew --repository)/Library/Taps/bqlog/homebrew-ci/Formula/bqlog.rb"

      - name: Install the build dependencies
        run: timeout -k 30 240 brew install --only-dependencies --verbose --formula --build-bottle bqlog/ci/bqlog

      - name: Build with --parallel ${{ matrix.parallel }} and watch memory
        timeout-minutes: 20
        continue-on-error: true
        run: |
          : > build.log
          set -m
          brew install --verbose --formula --build-bottle bqlog/ci/bqlog >build.log 2>&1 &
          bg=$!
          for i in $(seq 1 40); do
            sleep 15
            echo "=== elapsed $((i * 15))s | build.log $(wc -l < build.log) lines | procs $(ps -e --no-headers | wc -l) | cc1plus $(ps -C cc1plus --no-headers 2>/dev/null | wc -l)"
            echo "    mem: $(free -m | sed -n 2p)"
            echo "    cgroup: $(cat /sys/fs/cgroup/memory.current 2>/dev/null || cat /sys/fs/cgroup/memory/memory.usage_in_bytes 2>/dev/null || echo n/a)"
            ps -eo rss,pcpu,etime,comm --sort=-rss | head -8 | sed 's/^/      /'
            tail -n 2 build.log | sed 's/^/      /'
            if ! kill -0 "$bg" 2>/dev/null; then
              echo "=== build process finished"
              break
            fi
          done
          echo "=== build.log tail (40 lines)"
          tail -n 40 build.log
          echo "=== killing the process group"
          kill -9 -"$bg" 2>/dev/null || true
          wait "$bg" 2>/dev/null || true

      - name: Show the result
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          echo "build.log: $(wc -l < build.log) lines"
          echo "===== tail 60"
          tail -n 60 build.log

      - name: Upload the build log
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: build-log-parallel-${{ matrix.parallel }}
          path: /home/linuxbrew/build.log
