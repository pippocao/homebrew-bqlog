name: Repro - homebrew-core Linux x86_64 failure

# Runs the same brew steps as `brew test-bot` on Linux x86_64 inside the container the
# homebrew-core CI uses (ghcr.io/homebrew/brew:main). Every brew step is time bounded so the
# job always finishes and its logs survive, and a background monitor records memory, disk and
# processes every 20 s.
on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/homebrew/brew:main
      options: --init --user linuxbrew
    defaults:
      run:
        working-directory: /home/linuxbrew
        shell: /bin/bash -xeuo pipefail {0}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOME: /home/linuxbrew
    steps:
      - name: Environment
        run: |
          id
          echo "HOME=$HOME"
          ls -ld "$HOME"
          mkdir -p "$HOME/.homebrew"
          echo "homebrew state dir ok"
          uname -m
          echo "cpus: $(nproc)"
          free -m | sed -n 2p
          df -h / | tail -1
          brew --version

      - name: Put the formula in a tap
        run: |
          brew tap-new --no-git bqlog/ci
          cat >"$(brew --repository)/Library/Taps/bqlog/homebrew-ci/Formula/bqlog.rb" <<'FORMULA_EOF'
          class Bqlog < Formula
            desc "Lightweight, high-performance, cross-language logging library"
            homepage "https://github.com/Tencent/BqLog"
            # Placeholders: the release workflow and bump.sh write the url and sha256 of the new tag here.
            # An unfilled formula fails to fetch on purpose.
            url "https://github.com/Tencent/BqLog/archive/refs/tags/Release_2.7.0.tar.gz"
            sha256 "0edb9fd3ba80fd286958317848cbd10795aea9c273f88c80a6fe8903afc01de5"
            license "Apache-2.0"

            head "https://github.com/Tencent/BqLog.git", branch: "main"

            livecheck do
              url :stable
              regex(/^Release[._-]v?(\d+(?:\.\d+)+)$/i)
            end

            depends_on "cmake" => :build

            deny_network_access!

            def install
              args = ["-DBUILD_LIB_TYPE=both", "-DBQ_BUILD_TOOLS=ON", "-DBQ_WERROR=OFF"]
              args << "-DCMAKE_OSX_ARCHITECTURES=#{Hardware::CPU.arch}" if OS.mac?

              system "cmake", "-S", ".", "-B", "build", *std_cmake_args, *args
              system "cmake", "--build", "build", "--parallel"
              system "cmake", "--install", "build"
            end

            test do
              (testpath/"test.cpp").write <<~'CPP'
                #include <bq_log/bq_log.h>

                int main() {
                    // create_log rejects a config without an appenders_config object, so name one.
                    bq::log log = bq::log::create_log("homebrew_test",
                        "appenders_config.console.type=console\n"
                        "appenders_config.console.levels=[all]");
                    if (!log.is_valid()) {
                        return 1;
                    }
                    log.info("bqlog installed and linked");
                    log.force_flush();
                    return 0;
                }
              CPP
              system ENV.cxx, "test.cpp", "-std=c++17",
                     "-I#{include}", "-L#{lib}", "-lBqLog", "-Wl,-rpath,#{lib}",
                     "-o", "test"
              system "./test"

              assert_predicate bin/"BqLog_CategoryLogGenerator", :executable?
              assert_predicate bin/"BqLog_LogDecoder", :executable?
            end
          end
          FORMULA_EOF
          brew info bqlog/ci/bqlog

      - name: Start the resource monitor
        run: |
          nohup bash -c '
            while true; do
              echo "==== $(date -Is)"
              uptime
              free -m | sed -n 2p
              df -h / | tail -1
              ps -eo rss,pcpu,etime,comm --sort=-rss | head -8
              echo "processes: $(ps -e --no-headers | wc -l)"
              sleep 20
            done' >/home/linuxbrew/monitor.log 2>&1 &
          sleep 3
          cat /home/linuxbrew/monitor.log

      - name: brew install --only-dependencies
        continue-on-error: true
        run: |
          rc=0
          timeout -k 30 240 brew install --only-dependencies --verbose --formula --build-bottle bqlog/ci/bqlog || rc=$?
          echo "::warning::exit code $rc"
          exit $rc

      - name: brew install --build-bottle
        continue-on-error: true
        run: |
          rc=0
          timeout -k 30 600 brew install --verbose --formula --build-bottle bqlog/ci/bqlog || rc=$?
          echo "::warning::exit code $rc"
          exit $rc

      - name: brew fetch --test
        continue-on-error: true
        run: |
          rc=0
          timeout -k 30 180 brew fetch --formula --retry bqlog/ci/bqlog --test --build-bottle --force || rc=$?
          echo "::warning::exit code $rc"
          exit $rc

      - name: brew livecheck
        continue-on-error: true
        run: |
          rc=0
          timeout -k 30 180 brew livecheck --autobump --formula --json --full-name bqlog/ci/bqlog || rc=$?
          echo "::warning::exit code $rc"
          exit $rc

      - name: brew style
        continue-on-error: true
        run: |
          rc=0
          timeout -k 30 120 brew style --formula bqlog/ci/bqlog || rc=$?
          echo "::warning::exit code $rc"
          exit $rc

      - name: brew audit
        continue-on-error: true
        run: |
          rc=0
          timeout -k 30 240 brew audit --formula bqlog/ci/bqlog --online --new || rc=$?
          echo "::warning::exit code $rc"
          exit $rc

      - name: brew bottle, install the bottle, linkage
        continue-on-error: true
        run: |
          rc=0
          timeout -k 30 180 brew bottle --verbose --json bqlog/ci/bqlog || rc=$?
          echo "::warning::bottle exit code $rc"
          timeout -k 30 120 brew uninstall --formula --force --ignore-dependencies bqlog || true
          timeout -k 30 180 brew install ./bqlog--2.7.0.x86_64_linux.bottle.tar.gz || rc=$?
          echo "::warning::install bottle exit code $rc"
          timeout -k 30 120 brew linkage --test bqlog || rc=$?
          echo "::warning::linkage exit code $rc"
          exit $rc

      - name: brew test
        continue-on-error: true
        run: |
          rc=0
          timeout -k 30 240 brew test --verbose bqlog || rc=$?
          echo "::warning::exit code $rc"
          exit $rc

      - name: Resource monitor log
        if: always()
        run: tail -n 300 /home/linuxbrew/monitor.log

      - name: Upload the monitor log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: monitor-log
          path: /home/linuxbrew/monitor.log
