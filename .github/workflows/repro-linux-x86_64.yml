name: Repro - homebrew-core Linux x86_64 hang

# The homebrew-core CI `Test formulae` step hangs on Linux x86_64 for the bqlog formula.
# `brew install --build-bottle` itself reproduces it here. The build runs in the background
# with its output in a file, and a foreground loop prints where it is every 30 s, so the job
# always finishes and its logs survive.
on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/homebrew/brew:main
      options: --init --user linuxbrew
    defaults:
      run:
        working-directory: /home/linuxbrew
        shell: /bin/bash -xeuo pipefail {0}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOME: /home/linuxbrew
    steps:
      - name: Environment
        run: |
          echo "HOME=$HOME"; ls -ld "$HOME"; mkdir -p "$HOME/.homebrew"
          uname -m; echo "cpus: $(nproc)"; free -m | sed -n 2p; df -h / | tail -1
          brew --version

      - name: Put the formula in a tap
        run: |
          brew tap-new --no-git bqlog/ci
          cat >"$(brew --repository)/Library/Taps/bqlog/homebrew-ci/Formula/bqlog.rb" <<'FORMULA_EOF'
          class Bqlog < Formula
            desc "Lightweight, high-performance, cross-language logging library"
            homepage "https://github.com/Tencent/BqLog"
            # Placeholders: the release workflow and bump.sh write the url and sha256 of the new tag here.
            # An unfilled formula fails to fetch on purpose.
            url "https://github.com/Tencent/BqLog/archive/refs/tags/Release_2.7.0.tar.gz"
            sha256 "0edb9fd3ba80fd286958317848cbd10795aea9c273f88c80a6fe8903afc01de5"
            license "Apache-2.0"

            head "https://github.com/Tencent/BqLog.git", branch: "main"

            livecheck do
              url :stable
              regex(/^Release[._-]v?(\d+(?:\.\d+)+)$/i)
            end

            depends_on "cmake" => :build

            deny_network_access!

            def install
              args = ["-DBUILD_LIB_TYPE=both", "-DBQ_BUILD_TOOLS=ON", "-DBQ_WERROR=OFF"]
              args << "-DCMAKE_OSX_ARCHITECTURES=#{Hardware::CPU.arch}" if OS.mac?

              system "cmake", "-S", ".", "-B", "build", *std_cmake_args, *args
              system "cmake", "--build", "build", "--parallel"
              system "cmake", "--install", "build"
            end

            test do
              (testpath/"test.cpp").write <<~'CPP'
                #include <bq_log/bq_log.h>

                int main() {
                    // create_log rejects a config without an appenders_config object, so name one.
                    bq::log log = bq::log::create_log("homebrew_test",
                        "appenders_config.console.type=console\n"
                        "appenders_config.console.levels=[all]");
                    if (!log.is_valid()) {
                        return 1;
                    }
                    log.info("bqlog installed and linked");
                    log.force_flush();
                    return 0;
                }
              CPP
              system ENV.cxx, "test.cpp", "-std=c++17",
                     "-I#{include}", "-L#{lib}", "-lBqLog", "-Wl,-rpath,#{lib}",
                     "-o", "test"
              system "./test"

              assert_predicate bin/"BqLog_CategoryLogGenerator", :executable?
              assert_predicate bin/"BqLog_LogDecoder", :executable?
            end
          end
          FORMULA_EOF
          brew info bqlog/ci/bqlog

      - name: Install the build dependencies
        run: timeout -k 30 240 brew install --only-dependencies --verbose --formula --build-bottle bqlog/ci/bqlog

      - name: Build in the background and watch where it gets stuck
        run: |
          rm -f build.log build.rc
          setsid nohup bash -c 'brew install --verbose --formula --build-bottle bqlog/ci/bqlog >/home/linuxbrew/build.log 2>&1; echo $? >/home/linuxbrew/build.rc' >/dev/null 2>&1 </dev/null &
          sleep 5
          for i in $(seq 1 24); do
            sleep 30
            echo "======================= elapsed $((i * 30))s"
            if [ -f build.rc ]; then
              echo "BUILD FINISHED with exit code $(cat build.rc)"
              break
            fi
            echo "--- build.log: $(wc -l < build.log) lines, last 10:"
            tail -n 10 build.log
            echo "--- busiest processes:"
            ps -eo rss,pcpu,stat,wchan:22,etime,comm --sort=-pcpu | head -10
            echo "--- memory: $(free -m | sed -n 2p)"
            echo "--- disk:   $(df -h / | tail -1)"
          done
          echo "======================= build.log tail (80 lines)"
          tail -n 80 build.log
          echo "======================= process list"
          ps -eo pid,ppid,rss,pcpu,stat,wchan:22,etime,comm --sort=-rss | head -20
          echo "======================= killing what is left so this job can finish"
          pkill -9 -f 'cc1plus' || true
          pkill -9 -f cmake || true
          pkill -9 -f ninja || true
          pkill -9 -f bqlog || true
          sleep 3
          echo "remaining: $(ps -e --no-headers | wc -l) processes"

      - name: Upload the build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: /home/linuxbrew/build.log
